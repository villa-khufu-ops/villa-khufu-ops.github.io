*{box-sizing:border-box}
html,body{height:100%;margin:0}

button,input,select,textarea{font:inherit;color:inherit}

.grow{flex:1;min-width:0}

.badge.occ{background:var(--accent);color:var(--on-accent)}
.badge.grey{background:var(--grey-bg);color:var(--grey)}
.badge.info{background:var(--info-bg);color:var(--info)}
.ttl{font-size:15px;font-weight:800}
.sub{font-size:12px;color:var(--muted)}
.chip{font-size:11px;font-weight:800;padding:2px 9px;border-radius:9px;white-space:nowrap;flex-shrink:0}
.c-ok{background:var(--ok-bg);color:var(--ok)} .c-warn{background:var(--warn-bg);color:var(--warn)}

.b-line{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.b-warn{background:var(--surface);color:var(--warn);border:1.5px solid var(--warn)}
.b-wa{background:var(--surface);color:var(--wa);border:1.5px solid var(--wa);min-height:44px;font-size:14px}
.big{min-height:110px;border-radius:22px;border:0;padding:18px;display:flex;align-items:center;gap:16px;text-align:start;width:100%;background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.05)}

  if(x==='hk'){allNos().forEach(function(no){var r=room(no);if(needs(no)&&!r.task)n++;if(r.task&&r.task.st==='review')n++;});}
  if(x==='work'){allNos().forEach(function(no){var t=room(no).task;if(t&&t.w===S.uid&&taskUrgent(t))n++;});}
  if(x==='kit')S.orders.forEach(function(o){if(ordUrgentKit(o))n++;});
  if(x==='rest')S.orders.forEach(function(o){if(o.st==='ready')n++;});
  if(x==='rec')n+=S.greq.length+chatUnread();
  if(x==='lnd')S.laundry.forEach(function(o){if(o.st==='new')n++;});
  if(x==='mnt')S.maint.forEach(function(m){if(maintUrgent(m))n++;});
  return n;
}
function urgentForMe(){return areas().reduce(function(n,x){return n+urg(x);},0);}
function has(x){return areas().indexOf(x)>=0;}
function tomorrow(){var d=new Date();d.setDate(d.getDate()+1);return iso(d);}

// tomorrow's departures (occupied, leaving tomorrow) and arrivals (from the PMS's arrival report for tomorrow)
function tmrRooms(){var T=tomorrow(),P=prepOf(T),A=P.arr||{},L={};
  allNos().forEach(function(no){var r=room(no);if(r.status==='occ'&&r.out===T)L[no]={dep:true};});
  Object.keys(A).forEach(function(no){if(!META[no])return;L[no]=L[no]||{};L[no].arr=A[no];});
  return L;}
// on the day itself: hand each planned room to its worker as soon as it needs cleaning
function applyPre(){
  if(!db||!(has('hk')))return;var t=today(),P=prepOf(t),AS=P.assign||{};
  Object.keys(AS).forEach(function(no){var u=AS[no],k=t+no;if(S.preDone[k]||!S.staff[u]||S.staff[u].active===false)return;
    var r=room(no);if(!needs(no)||r.task)return;S.preDone[k]=1;
    logEv('assign',no,{w:u,reason:reasonOf(r),pre:true});upd(no,{task:{w:u,st:'new',at:Date.now(),ackAt:0,next:0,doneAt:0}});});
}

// ----- guest chat: one thread per phone + room, its random id is the key to read it -----
function gUnread(){var G=S.g;if(G.tab==='chat')return 0;return G.msgs.slice(G.seen||0).filter(function(m){return m.from==='rec';}).length;}
var gChatUnsub=null;
function gListen(){var G=S.g;if(!db||!G.tid||gChatUnsub)return;
  gChatUnsub=db.collection('chats').doc(G.tid).collection('msgs').orderBy('at').onSnapshot(function(sn){var l=[];sn.forEach(function(d){l.push(d.data());});var nw=l.length>G.msgs.length&&l[l.length-1].from==='rec';G.msgs=l;render();if(nw&&G.tab==='chat')window.scrollTo(0,document.body.scrollHeight);},function(){});}
function gTidKey(){return 'vkChat'+S.g.room;}
function gChatSend(){
  var G=S.g,el=document.getElementById('gmsg'),t=((el||{}).value||'').trim().slice(0,500);if(!t||!db||G.busy)return;
  G.busy=true;G.err='';var now=Date.now(),first=!G.tid;
  if(first){var a=new Uint8Array(16);(window.crypto||window.msCrypto).getRandomValues(a);G.tid=Array.prototype.map.call(a,function(x){return ('0'+x.toString(16)).slice(-2);}).join('');}
  var ref=db.collection('chats').doc(G.tid),b=db.batch();
  if(first)b.set(ref,{room:G.room,at:now,last:now,lastFrom:'guest',lastText:t.slice(0,80),open:true,unread:1});
  else b.set(ref,{last:now,lastFrom:'guest',lastText:t.slice(0,80),open:true,unread:1},{merge:true});
  b.set(ref.collection('msgs').doc(),{from:'guest',text:t,at:now});
  b.commit().then(function(){pushEvt('chat',G.tid);G.busy=false;if(first){try{localStorage.setItem(gTidKey(),G.tid);}catch(e){}gListen();}var e2=document.getElementById('gmsg');if(e2)e2.value='';render();window.scrollTo(0,document.body.scrollHeight);})
   .catch(function(e){G.busy=false;if(first)G.tid='';G.err=e&&e.code==='permission-denied'?'We could not send this for room '+G.room+'. Please check the room number or call reception.':'Could not send. Check your internet and try again.';render();});
}
function gSend(doc,kind){
  var G=S.g;if(!db||G.busy)return;G.busy=true;G.err='';render();
  doc.room=G.room;doc.at=Date.now();doc.st='new';doc.type=kind;
  db.collection('greq').add(doc).then(function(ref){pushEvt('greq',ref&&ref.id);G.busy=false;G.sent=kind;G.cart={};G.tour=null;render();window.scrollTo(0,0);})
   .catch(function(e){G.busy=false;G.err=e&&e.code==='permission-denied'?'We could not send this for room '+G.room+'. Please check the room number or call reception.':'Could not send. Check your internet and try again.';render();});
}
function gOpenRoom(){var G=S.g;try{G.tid=localStorage.getItem(gTidKey())||'';}catch(e){G.tid='';}G.msgs=[];G.seen=0;gListen();}
function guestAct(a,b){
  var G=S.g;
  if(a==='gRoom'){var v=((document.getElementById('groom')||{}).value||'').trim();if(v.length<3)v=('000'+v).slice(-3);if(!META[v]){G.err='Please enter a valid room number.';render();return;}G.room=v;G.err='';try{sessionStorage.setItem('vkRoom',v);}catch(e){}gOpenRoom();render();return;}
  if(a==='gRoomChange'){G.room='';G.sent=null;if(gChatUnsub){try{gChatUnsub();}catch(e){}gChatUnsub=null;}G.tid='';G.msgs=[];G.seen=0;render();return;}
  if(a==='gChatSend'){gChatSend();return;}
  if(a==='gAgain'){G.sent=null;G.tab='';render();return;}
  if(a==='gHome'){G.tab='';G.tour=null;G.err='';render();window.scrollTo(0,0);return;}
  if(a==='gTab'){G.tab=b.dataset.t;G.err='';render();window.scrollTo(0,0);return;}
  if(a==='gCat'){G.cat=+b.dataset.i;render();return;}
  if(a==='gPlace'){G.place=b.dataset.p;render();return;}
  if(a==='gQ'){var k=b.dataset.k;G.cart[k]=Math.max(0,Math.min(20,(G.cart[k]||0)+(+b.dataset.d)));if(!G.cart[k])delete G.cart[k];render();return;}
  if(a==='gTour'){G.tour=+b.dataset.i;G.pax=Math.max(2,tourRule(+b.dataset.i).min||0);G.err='';G.pkg=null;G.hrs=0;G.tdate='';G.ttime='';G.tnote='';render();window.scrollTo(0,0);return;}
  if(a==='gTourBack'){G.tour=null;render();return;}
  if(a==='gPax'||a==='gPkg'||a==='gHrs'){G.tdate=(document.getElementById('gdate')||{}).value||G.tdate;G.ttime=(document.getElementById('gtime')||{}).value||G.ttime;G.tnote=(document.getElementById('gnoteT')||{}).value||'';}
  if(a==='gPkg'){G.pkg=b.dataset.k;render();return;}
  if(a==='gHrs'){var R0=tourRule(G.tour);G.hrs=Math.max(1,Math.min(8,(G.hrs||R0.hours||1)+(+b.dataset.d)));render();return;}
  if(a==='gPax'){G.pax=Math.max(tourRule(G.tour).min||1,Math.min(30,G.pax+(+b.dataset.d)));render();return;}
  if(a==='gSendTour'){var d=(document.getElementById('gdate')||{}).value||'';var tm=((document.getElementById('gtime')||{}).value||'').slice(0,5);var t=tourById(G.tour);
    if(!d){G.err='Please choose the date.';render();return;}
    var pk=tourPkg(t[0],G.pkg);
    var hrs=tourRule(t[0]).hourly?(G.hrs||tourRule(t[0]).hours||1):0;
    var tt0={id:t[0],pax:G.pax,date:d,time:tm};if(hrs)tt0.hours=hrs;if(pk){tt0.pkg=pk[0];tt0.pp=pk[1];}
    gSend({tour:tt0,items:[],note:((document.getElementById('gnoteT')||{}).value||'').trim().slice(0,200)},'tour');return;}
  if(a==='gSendFood'){var it=Object.keys(G.cart).slice(0,40).map(function(k){var x=itemAt(k);return {k:k,n:x.n,p:x.p,q:G.cart[k]};});if(!it.length)return;
    gSend({items:it,place:G.place||'room',note:((document.getElementById('gnoteF')||{}).value||'').trim().slice(0,200)},'food');return;}
}
function gqSet(id,st){if(!db||!id)return;db.collection('greq').doc(id).set({st:st,doneAt:Date.now(),doneBy:S.uid},{merge:true}).catch(function(e){flash(e&&e.code==='permission-denied'?'لازم تحديث قواعد Firebase (Rules) الأول':'ما اتحفظش، جرّب تاني');});}

// ----- room report (reception) -----
function loadRoomRep(no,from,to){
  if(!db)return;
  if(to<from){var x=from;from=to;to=x;}
  S.rrep={no:no,from:from,to:to,loading:true,rows:null,err:''};render();
  var inR=function(d){return d&&d>=from&&d<=to;};
  var dOf=function(ts){return iso(new Date(ts));};
  var q=function(c,f,v){return db.collection(c).where(f,'==',v).get().then(function(sn){var l=[];sn.forEach(function(d){l.push(Object.assign({id:d.id},d.data()));});return l;});};
  Promise.all([q('log','room',no),q('log','to',no),q('orders','room',no),q('laundry','room',no),q('maint','room',no)]).then(function(R){
    var rows=[];
    R[0].forEach(function(e){if(inR(e.d))rows.push({k:'log',at:e.at,e:e});});
    R[1].forEach(function(e){if(inR(e.d)&&e.type==='move')rows.push({k:'movein',at:e.at,e:e});});
    R[2].forEach(function(o){if(inR(o.d))rows.push({k:o.kind==='mini'?'mini':o.kind==='tour'?'tour':'food',at:o.at,e:o});});
    R[3].forEach(function(o){if(inR(o.d))rows.push({k:'wash',at:o.at,e:o});});
    R[4].forEach(function(m){if(inR(dOf(m.at)))rows.push({k:'maint',at:m.at,e:m});});
    rows.sort(function(a,b){return a.at-b.at;});
    if(S.rrep&&S.rrep.no===no){S.rrep.rows=rows;S.rrep.loading=false;render();}
  }).catch(function(e){if(S.rrep&&S.rrep.no===no){S.rrep.loading=false;S.rrep.err=e&&e.code==='permission-denied'?'مش مسموح تشوف التقرير ده':'ما قدرتش أحمّل التقرير، جرّب تاني';render();}});
}
var LOGTXT={checkin:'تشيك إن',checkout:'تشيك آوت · خروج',cleanReq:'طلب نظافة',cleanCancel:'اتلغى طلب النظافة',assign:'اتوزعت للنظافة',ack:'العاملة استلمت الغرفة',done:'العاملة خلّصت التنظيف',approve:'المشرف راجع ووافق · الغرفة جاهزة',redo:'المشرف رجّعها تتعاد',paid:'تحصيل حساب',extend:'تغيير ميعاد الخروج',void:'إلغاء من الحساب',plan:'تغيير نوع الحجز',note:'طلب خاص للهاوس كيبنج',dnd:'النزيل رافض النظافة / DND'};

  if(S.daily.err)return head+'<p class="err">'+h(S.daily.err)+'</p></div>';
  var by={};

  var rooms=Object.keys(by).sort();
  var cnt={req:0,out:0,cleaned:0,ok:0,arr:0};

    var arr=ev.some(function(e){return /وصول/.test(e.reason||'');});

    return;

  if(f.id==='expForm'){var ef=document.getElementById('exf').value,et=document.getElementById('ext').value;if(!ef||!et){flash('اختار التاريخ');return;}doExport(ef,et);return;}
  if(f.id==='rrForm'){
    var rno=document.getElementById('rrno').value,rf=document.getElementById('rrfrom').value,rt=document.getElementById('rrto').value;
    if(!rno){S.err='اختار رقم الغرفة';render();return;}
    if(!rf||!rt){S.err='اختار التاريخ';render();return;}
    S.err='';loadRoomRep(rno,rf,rt);return;
  }
  if(f.id==='nameForm'){
    var nn=(document.getElementById('nn').value||'').trim().slice(0,40);if(!nn){S.err='اكتب الاسم';render();return;}
    db.collection('staff').doc(S.uid).set({name:nn},{merge:true}).then(function(){flash('الاسم اتغيّر لـ '+nn);}).catch(function(e){flash(e&&e.code==='permission-denied'?'تغيير الاسم محتاج تحديث قواعد Firebase (Rules)':'ما اتحفظش، جرّب تاني');});return;
  }
  if(f.id==='pinForm'){
    var op=document.getElementById('op').value,np=document.getElementById('np').value,me=meDoc();
    if(np.length<6){S.err='الرقم الجديد لازم 6 أرقام أو أكتر';render();return;}
    S.busy=true;S.err='';render();
    var user=auth.currentUser,cr=firebase.auth.EmailAuthProvider.credential(me.username+DOMAIN,op);
    user.reauthenticateWithCredential(cr).then(function(){return user.updatePassword(np);}).then(function(){S.busy=false;go(homeOf());flash('الرقم السري اتغيّر');var a1=document.getElementById('op');}).catch(function(e){
      S.busy=false;S.err=e&&(e.code==='auth/wrong-password'||e.code==='auth/invalid-credential'||e.code==='auth/invalid-login-credentials')?'الرقم السري الحالي غلط':'ما اتغيّرش، جرّب تاني';render();});
    return;
  }
  if(f.id==='repForm'){
    var rno=S.p.no;if(!S.p.issue){S.err='اختار نوع المشكلة';render();return;}
    var blk=document.getElementById('mblock'),blocks=!!(blk&&blk.checked);
    var note=(document.getElementById('mnote').value||'').trim().slice(0,300);
    var doc={room:rno,issue:S.p.issue,note:note,by:S.uid,at:Date.now(),blocks:blocks,open:true};
    db.collection('maint').add(doc).then(function(ref){pushEvt('maint',ref&&ref.id);}).catch(function(){flash('البلاغ ما اتبعتش، جرّب تاني');});
    if(blocks)upd(rno,{status:'maint'});
    var back=S.p.back||homeOf();go(back,(back==='hk-room'||back==='rec-room')?{no:rno}:{});
    var txt='بلاغ صيانة · غرفة '+rno+' · '+S.p.issue+(note?' · '+note:'');
    flash('بلاغ صيانة غرفة '+rno+' اتبعت للفني والريسبشن ومدير الهاوس كيبنج',waFor(mntStaff().concat(hkManagers(),receptionists()),txt));return;
  }
  if(f.id==='userForm'){
    var ex=S.p.u,name=document.getElementById('un').value.trim(),role=document.getElementById('ur').value,act=document.getElementById('ua').checked,phone=(document.getElementById('uph').value||'').trim();
    if(!name){S.err='اكتب الاسم';render();return;}
    if(ex===S.uid&&(!act||role!=='admin')){S.err='مينفعش توقف حسابك أو تشيل صلاحية المدير من نفسك';render();return;}
    if(ex){
      db.collection('staff').doc(ex).set({name:name,role:role,active:act,phone:phone},{merge:true}).then(function(){go('users');flash('اتحفظ '+name);}).catch(function(){S.err='ما اتحفظش، جرّب تاني';render();});
      return;
    }
    var uname=(document.getElementById('uu').value||'').trim().toLowerCase(),pin=document.getElementById('up').value;
    if(!/^[a-z0-9._-]{2,30}$/.test(uname)){S.err='اسم المستخدم حروف إنجليزي صغيرة وأرقام بس';render();return;}
    if(Object.keys(S.staff).some(function(k){return S.staff[k].username===uname;})){S.err='اسم المستخدم ده موجود';render();return;}
    if(pin.length<6){S.err='الرقم السري لازم 6 أرقام أو أكتر';render();return;}
    S.busy=true;S.err='';render();
    // a second Firebase app creates the account without signing the admin out
    var sec=firebase.apps.filter(function(x){return x.name==='creator';})[0]||firebase.initializeApp(cfg,'creator');
    sec.auth().createUserWithEmailAndPassword(uname+DOMAIN,pin).then(function(cred){
      var uid=cred.user.uid;
      return db.collection('staff').doc(uid).set({name:name,username:uname,role:role,phone:phone,active:act,order:Object.keys(S.staff).length+1}).then(function(){return sec.auth().signOut();});
    }).then(function(){S.busy=false;go('users');flash('اتعمل حساب '+name+' (@'+uname+')',phone?[{label:'ابعت بيانات الدخول لـ'+name,phone:phone,text:'أهلاً '+name+' · حسابك على أبلكيشن Villa Khufu:\nاسم المستخدم: '+uname+'\nالرقم السري: '+pin+'\nاللينك: '+location.href.split('#')[0]}]:[]);}).catch(function(e){
      S.busy=false;S.err=e&&e.code==='auth/email-already-in-use'?'اسم المستخدم ده متسجّل قبل كده':'ما اتعملش: '+(e&&e.message||'');render();});
    return;
  }
  if(f.id==='inForm'){
    var no=S.p.no,din=document.getElementById('din').value,dout=document.getElementById('dout').value,sofa=document.getElementById('sofa');
    if(!din||!dout){S.err='اختار تاريخ الدخول والخروج';render();return;}
    if(dayDiff(din,dout)<1){S.err='تاريخ الخروج لازم يكون بعد تاريخ الدخول';render();return;}
    if(room(no).status!=='free'){S.err='الغرفة دي مبقتش فاضية';render();return;}
    upd(no,{status:'occ',in:din,out:dout,sofa:!!(sofa&&sofa.checked),cleanReq:null,task:null,arrival:null,src:'walkin',plan:(document.getElementById('dplan')||{}).value||'BB'});
    logEv('checkin',no,{src:'walkin'});aioTodo(no,'حجز جديد + تشيك إن (Walk-in) من '+fmt(din)+' لـ '+fmt(dout));go('rec');flash('تم التشيك إن · غرفة '+no+' من '+fmt(din)+' لـ '+fmt(dout)+aioNote());return;
  }
});

// ---------- sound ----------
var audioOk=false,snoozeUntil=0,lastUrg=0;
function getAudio(){try{if(!audio){audio=new Audio('ring.mp4');audio.preload='auto';}}catch(e){}return audio;}
function stopRing(){try{audio&&audio.pause();}catch(e){}}
function toggleSound(){
  if(S.sound){S.sound=false;try{localStorage.setItem('vkSound','0');}catch(e){}stopRing();render();return;}
  getAudio();S.sound=true;snoozeUntil=0;try{localStorage.setItem('vkSound','1');}catch(e){}ticks=0;render();ring();
}
function ring(){
  var u=urgentForMe();if(u>lastUrg)snoozeUntil=0;lastUrg=u;
  if(!S.sound||!u||Date.now()<snoozeUntil)return;
  var a=getAudio();if(!a)return;
  try{a.muted=false;a.currentTime=0;var p=a.play();if(p&&p.then)p.then(function(){audioOk=true;},function(){audioOk=false;});else audioOk=true;}catch(e){}
}
// أول لمسة على الشاشة بتفتح الصوت (المتصفح مش بيسمح بالصوت قبل أول لمسة)
// ولو الجرس بيرن: أي لمسة أو أي زرار (ومنهم زراير الصوت لو الجهاز بيبعتها) يسكّته دقيقتين
var lastUnlock=0;
function userTouch(e){
  var a=getAudio(),ringing=a&&!a.paused&&!a.ended;
  if(Date.now()-lastUnlock<1500)return; // نفس اللمسة اللي فتحت الصوت
  if(!audioOk){if(e&&e.type==='pointerdown'&&e.pointerType!=='mouse')return;lastUnlock=Date.now();if(a){try{a.muted=true;var p=a.play();var done=function(){try{a.pause();a.currentTime=0;}catch(x){}a.muted=false;audioOk=true;ring();};if(p&&p.then)p.then(done,function(){a.muted=false;});else done();}catch(x){}}return;}
  if(S.sound&&urgentForMe()&&(ringing||Date.now()>=snoozeUntil)){
    var onBell=e&&e.target&&e.target.closest&&e.target.closest('[data-a="sound"]');
    if(!onBell){snoozeUntil=Date.now()+120000;stopRing();}
  }
}
['pointerdown','touchend','click','keydown'].forEach(function(t){document.addEventListener(t,userTouch,{capture:true,passive:true});});
setInterval(function(){
  S.now=Date.now();ticks++;
  var uNow=urgentForMe();if(uNow>lastUrg){snoozeUntil=0;}lastUrg=uNow;
  if(S.uid&&db&&S.prepDay&&S.prepDay!==today())listenPrep();
  if(ticks%4===0)ring();
  var inForm=document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(!inForm&&S.uid&&(S.view==='work'||S.view==='hk'||S.view==='home'||S.view==='kit'||S.view==='rest-orders'||S.view==='lnd'||S.view==='mnt'))render();
},1000);

// ---------- data ----------
var prepUnsubs=[];
function listenPrep(){
  prepUnsubs.forEach(function(u){try{u();}catch(e){}});prepUnsubs=[];S.prep={};S.prepDay=today();
  [today(),tomorrow()].forEach(function(d){prepUnsubs.push(db.collection('prep').doc(d).onSnapshot(function(sn){S.prep[d]=sn.exists?sn.data():{};render();applyPre();},function(){}));});
}
function stopListening(){prepUnsubs.forEach(function(u){try{u();}catch(e){}});prepUnsubs=[];unsubs.forEach(function(u){try{u();}catch(e){}});unsubs=[];S.staff={};S.rooms={};S.maint=[];S.orders=[];S.bills=[];S.laundry=[];S.lbills=[];S.aio=[];S.lost=[];S.greq=[];S.chats=[];S.staffLoaded=false;}
function listen(){
  stopListening();
  unsubs.push(db.collection('staff').onSnapshot(function(snap){var o={};snap.forEach(function(d){o[d.id]=d.data();});S.staff=o;S.staffLoaded=true;render();},function(){S.staffLoaded=true;render();}));
  unsubs.push(db.collection('rooms').onSnapshot(function(snap){var o={},before=urgentForMe();snap.forEach(function(d){o[d.id]=d.data();});S.rooms=o;render();if(urgentForMe()>before)ring();applyPre();},function(){}));
  unsubs.push(db.collection('maint').where('open','==',true).onSnapshot(function(snap){var before=urgentForMe(),l=[];snap.forEach(function(d){l.push(Object.assign({id:d.id},d.data()));});S.maint=l.sort(function(a,b){return b.at-a.at;});render();if(urgentForMe()>before)ring();},function(){}));
  // restaurant orders of the last 36 hours, and every room bill that isn't paid yet
  unsubs.push(db.collection('orders').where('at','>=',Date.now()-36*3600000).onSnapshot(function(snap){var l=[],before=urgentForMe();snap.forEach(function(d){l.push(Object.assign({id:d.id},d.data()));});S.orders=l;render();if(urgentForMe()>before)ring();},function(){}));
  unsubs.push(db.collection('orders').where('paid','==',false).onSnapshot(function(snap){var l=[];snap.forEach(function(d){l.push(Object.assign({id:d.id},d.data()));});S.bills=l;render();},function(){}));
  listenPrep();
  // open guest chats
  unsubs.push(db.collection('chats').where('open','==',true).onSnapshot(function(snap){var l=[],before=urgentForMe();snap.forEach(function(d){l.push(Object.assign({id:d.id},d.data()));});S.chats=l;render();if(urgentForMe()>before)ring();},function(){}));
  // guest requests from the QR page (reception and the manager can read them)
  unsubs.push(db.collection('greq').where('st','==','new').onSnapshot(function(snap){var l=[],before=urgentForMe();snap.forEach(function(d){l.push(Object.assign({id:d.id},d.data()));});S.greq=l;render();if(urgentForMe()>before)ring();},function(){}));
  unsubs.push(db.collection('lost').where('st','==','held').onSnapshot(function(snap){var l=[];snap.forEach(function(d){l.push(Object.assign({id:d.id},d.data()));});S.lost=l;render();},function(){}));
  // laundry still in the laundry room, and every laundry bill that isn't paid yet
  unsubs.push(db.collection('laundry').where('st','in',['new','wash','ready']).onSnapshot(function(snap){var l=[],before=urgentForMe();snap.forEach(function(d){l.push(Object.assign({id:d.id},d.data()));});S.laundry=l;render();if(urgentForMe()>before)ring();},function(){}));
  unsubs.push(db.collection('laundry').where('paid','==',false).onSnapshot(function(snap){var l=[];snap.forEach(function(d){l.push(Object.assign({id:d.id},d.data()));});S.lbills=l;render();},function(){}));
}
if(!configured){render();return;}
fb=firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();
if(GQ){document.documentElement.lang='en';document.documentElement.dir='ltr';document.title='Villa Khufu · Guest services';try{S.g.room=sessionStorage.getItem('vkRoom')||'';}catch(e){}if(S.g.room)gOpenRoom();S.ready=true;render();return;}
try{db.enablePersistence({synchronizeTabs:true}).catch(function(){});}catch(e){}
db.collection('meta').doc('setup').onSnapshot(function(d){S.setup=d.exists;render();},function(){S.setup=true;render();});
auth.onAuthStateChanged(function(user){
  S.ready=true;
  if(user){S.uid=user.uid;listen();}else{S.uid=null;stopListening();}
  render();
});
})();
</script>
