# Villa Khufu – builds the Android app (android/: the hotel app + arrival notices) and puts it on the website:
#   https://villa-khufu-ops.github.io/download/villa-khufu.apk
# The signing key is made on the first build and kept in the Actions cache (the weekly run keeps it alive),
# so every new version installs over the old one.
name: Android app

on:
  push:
    branches: [main]
    paths: ['android/**']
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write
  pages: write

concurrency:
  group: android-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Signing key
        id: key
        uses: actions/cache@v4
        with:
          path: ~/vk-key
          key: vk-android-signing-key-v1

      - name: Make signing key (first build only)
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/vk-key
          openssl rand -hex 24 > ~/vk-key/pass
          keytool -genkeypair -keystore ~/vk-key/vk.jks -alias vk -keyalg RSA -keysize 2048 -validity 20000 \
            -storepass "$(cat ~/vk-key/pass)" -keypass "$(cat ~/vk-key/pass)" -dname "CN=Villa Khufu, O=Villa Khufu Pyramids Hotel, C=EG"

      - name: Weekly run only keeps the key alive
        if: github.event_name == 'schedule'
        run: echo "key kept" && exit 0

      - uses: actions/setup-java@v4
        if: github.event_name != 'schedule'
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        if: github.event_name != 'schedule'
        with:
          gradle-version: '8.7'

      - name: Build
        if: github.event_name != 'schedule'
        working-directory: android
        run: |
          export VK_KEYSTORE=$HOME/vk-key/vk.jks VK_KEYPASS="$(cat ~/vk-key/pass)"
          export VK_CODE=$GITHUB_RUN_NUMBER VK_NAME="1.$GITHUB_RUN_NUMBER"
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee /tmp/build.log

      - name: Put the app on the website
        if: github.event_name != 'schedule'
        run: |
          mkdir -p download
          rm -f download/vk-attendance.apk
          cp android/app/build/outputs/apk/release/app-release.apk download/villa-khufu.apk
          CERT=$(keytool -list -v -keystore ~/vk-key/vk.jks -storepass "$(cat ~/vk-key/pass)" -alias vk | grep -m1 'SHA256:' | sed 's/.*SHA256: *//')
          printf '{"version":"1.%s","code":%s,"at":"%s","sha256":"%s","cert":"%s"}\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$(date -u +%FT%TZ)" "$(sha256sum download/villa-khufu.apk | cut -d' ' -f1)" "$CERT" > download/version.json
          rm -f download/build-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add -A download
          git commit -m "Android app 1.$GITHUB_RUN_NUMBER"
          git pull --rebase -q && git push
          # a push made by the workflow doesn't republish the website on its own
          curl -s -X POST -H "Authorization: Bearer ${{ github.token }}" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds" || true

      - name: Report a failed build
        if: failure() && github.event_name != 'schedule'
        run: |
          mkdir -p download
          { echo "run $GITHUB_RUN_NUMBER $(date -u +%FT%TZ)"; tail -n 120 /tmp/build.log 2>/dev/null; } > download/build-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add download && git commit -m "Android build failed (log)" && git pull --rebase -q && git push
